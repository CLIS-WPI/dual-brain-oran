apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oai-ric.fullname" . }}-config
  labels:
    {{- include "oai-ric.labels" . | nindent 4 }}
    app.kubernetes.io/component: ric
data:
  flexric.conf: |
    [NEAR-RIC]
    NEAR_RIC_IP = {{ .Values.ric.config.nearRicIp | default "__POD_IP__" }}

    [XAPP]
    DB_DIR = {{ .Values.ric.config.xappDbDir }}
