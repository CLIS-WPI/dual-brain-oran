{{- if .Values.nrf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oai-5g-core.fullname" . }}-nrf
  labels:
    {{- include "oai-5g-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: nrf
spec:
  replicas: {{ .Values.nrf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: nrf
      harmony.telecom/tenant: {{ .Values.tenant.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nrf
        harmony.telecom/tenant: {{ .Values.tenant.name }}
      annotations:
        {{- include "oai-5g-core.rolloutAnnotation" . | nindent 8 }}
    spec:
      containers:
        - name: nrf
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-nrf:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: sbi
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oai-5g-core.fullname" . }}-nrf
  labels:
    {{- include "oai-5g-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: nrf
spec:
  selector:
    app.kubernetes.io/component: nrf
    harmony.telecom/tenant: {{ .Values.tenant.name }}
  ports:
    - name: sbi
      port: 8080
      targetPort: sbi
{{- end }}
