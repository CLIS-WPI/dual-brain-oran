{{- if .Values.ausf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oai-5g-core.fullname" . }}-ausf
  labels:
    {{- include "oai-5g-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: ausf
spec:
  replicas: {{ .Values.ausf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: ausf
      harmony.telecom/tenant: {{ .Values.tenant.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ausf
        harmony.telecom/tenant: {{ .Values.tenant.name }}
      annotations:
        {{- include "oai-5g-core.rolloutAnnotation" . | nindent 8 }}
    spec:
      containers:
        - name: ausf
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-ausf:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NRF_HOST
              value: "{{ include "oai-5g-core.fullname" . }}-nrf"
            - name: UDM_HOST
              value: "{{ include "oai-5g-core.fullname" . }}-udm"
            - name: MCC
              value: {{ .Values.plmn.mcc | quote }}
            - name: MNC
              value: {{ .Values.plmn.mnc | quote }}
          ports:
            - containerPort: 8080
              name: sbi
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oai-5g-core.fullname" . }}-ausf
  labels:
    {{- include "oai-5g-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: ausf
spec:
  selector:
    app.kubernetes.io/component: ausf
    harmony.telecom/tenant: {{ .Values.tenant.name }}
  ports:
    - name: sbi
      port: 8080
      targetPort: sbi
{{- end }}
