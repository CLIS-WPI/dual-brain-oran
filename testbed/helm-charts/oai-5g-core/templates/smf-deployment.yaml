{{- if .Values.smf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oai-5g-core.fullname" . }}-smf
  labels:
    {{- include "oai-5g-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: smf
spec:
  replicas: {{ .Values.smf.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: smf
      harmony.telecom/tenant: {{ .Values.tenant.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: smf
        harmony.telecom/tenant: {{ .Values.tenant.name }}
      annotations:
        {{- include "oai-5g-core.rolloutAnnotation" . | nindent 8 }}
    spec:
      containers:
        - name: smf
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-smf:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NRF_HOST
              value: "{{ include "oai-5g-core.fullname" . }}-nrf"
            - name: UPF_HOST
              value: "{{ include "oai-5g-core.fullname" . }}-upf"
            - name: MCC
              value: {{ .Values.plmn.mcc | quote }}
            - name: MNC
              value: {{ .Values.plmn.mnc | quote }}
          ports:
            - containerPort: 8080
              name: sbi
            - containerPort: 8805
              name: pfcp
              protocol: UDP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oai-5g-core.fullname" . }}-smf
  labels:
    {{- include "oai-5g-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: smf
spec:
  selector:
    app.kubernetes.io/component: smf
    harmony.telecom/tenant: {{ .Values.tenant.name }}
  ports:
    - name: sbi
      port: 8080
      targetPort: sbi
    - name: pfcp
      port: 8805
      targetPort: pfcp
      protocol: UDP
{{- end }}
